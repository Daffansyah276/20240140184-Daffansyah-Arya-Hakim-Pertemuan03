<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistem AI UMKM SOTO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="#profile">Profile</a>
        <a href="#formdata">form</a>
    </nav>
<img src ="screenshot.png" alt="SOTO TRIWINDU" width="550" height="310">
    <header>
        <h1>SOTO TRIWINDU </h1>
        <h2>Menerima Pesanan</h2>
    </header>
    <form action ="#">
        <label for="nama">Masukkan nama anda :</label>
        <input type="text" name="nama" id="nama">
        <fieldset id = "jenis kelamin ">
            <legend>Jenis Kelamin</legend>
            <input type="radio" name="pria" id = "pria">
            <label for="pria">Pria</label>
            <input type="radio" name="wanita" id = "wanita">
            <label for="wanita">Wanita</label>
        </fieldset>
        <fieldset id = "pesanan">
            <legend>Pesanan</legend>
            <input type="radio" name="soto ayam" id = "soto ayam">
            <label for="soto ayam">Soto Ayam</label>
            <input type="radio" name="soto daging" id = "soto daging">
            <label for="soto daging">Soto Daging</label>
            <input type="radio" name="soto babat" id = "soto babat">
            <label for="soto babat">Soto Babat</label>
        </fieldset>
        <fieldset id = "Minuman">
            <legend>Minuman</legend>
            <input type="radio" name="es teh" id = "es teh">
            <label for="es teh">Es Teh</label>
            <input type="radio" name="es jeruk" id = "es jeruk">
            <label for="es jeruk">Es Jeruk</label>
            <input type="radio" name="air mineral" id = "air mineral">
            <label for="air mineral">Air Mineral</label>
            <input type="radio" name="es kopi Gooday" id = "es kopi">
            <label for="es kopi">Es Kopi Gooday</label>
        </fieldset>

    <footer>
        <hrep>Contact Us :</hrep>
        <p> Alamat : Jalan Teuku Umar, RT 01 RW 01, Keprabon, Banjarsari, Solo.</p>
        <p>Terima kasih telah memesan di SOTO TRIWINDU</p>
    </footer>
</body>
</html>
